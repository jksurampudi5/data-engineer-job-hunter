name: Daily Job Link Verification

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify application links
        run: python3 scripts/check_jobs.py
